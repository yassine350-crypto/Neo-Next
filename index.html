<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Neo-Next</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Michroma&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --surface:#111113;
  --line:#2a2a2e;
  --text:#f5f3ee;
  --muted:#9b9aa0;
  --gold:#d3a44b;
  --gold-soft:rgba(211,164,75,.16);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  background:var(--bg);color:var(--text);
  font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  background:var(--bg);z-index:10;
}
main{
  width:100%;max-width:440px;
  padding:48px 24px 40px;
  display:flex;flex-direction:column;align-items:center;
  position:relative;
}
.logo-wrap{position:relative;width:176px;height:176px;margin-bottom:28px}
.logo-wrap::before{
  content:"";position:absolute;inset:-46px;border-radius:50%;
  background:radial-gradient(closest-side,var(--gold-soft),transparent 72%);
}
.logo-wrap img{
  position:relative;display:block;width:100%;height:100%;border-radius:50%;
  box-shadow:0 0 0 1px rgba(211,164,75,.55),0 0 0 6px #000,0 0 0 7px rgba(211,164,75,.22);
}
h1{
  margin:0;font-family:"Michroma","Outfit",system-ui,sans-serif;
  font-weight:400;font-size:1.05rem;letter-spacing:.14em;
  color:var(--text);
}
h1 span{color:var(--gold)}
.city{margin:10px 0 36px;color:var(--muted);font-size:1rem}
.links{width:100%;display:grid;gap:12px}
.btn{
  display:flex;align-items:center;gap:14px;
  min-height:60px;padding:0 20px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);
  color:var(--text);text-decoration:none;font-size:1.05rem;font-weight:500;
  transition:border-color .2s,background .2s,transform .15s;
}
.btn svg{width:22px;height:22px;flex:none;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn small{display:block;color:var(--muted);font-size:.85rem;font-weight:400;margin-top:1px}
.btn:hover{border-color:var(--gold)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#0b0a08}
.btn.primary svg{stroke:#0b0a08}
.btn.primary small{color:rgba(11,10,8,.72)}
.btn.primary:hover{background:#e0b45a}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
main{animation:rise .7s ease-out both}
@media (prefers-reduced-motion:reduce){main{animation:none}.btn{transition:none}}
</style>
</head>
